      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      section{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      h1{
        height:10px;
        background-color: #575555;
        color: white;
        font-family: monospace;
        text-align: center;
        padding: 30px 0px;
      }
      .card {
        width: 300px;
        padding: 20px;
        border: 2px red;
        border-radius: 10px;
        margin: 20px auto;
        box-shadow: 2px 2px 20px;
        background-color: white;
        font-family: sans-serif;
      }
      .card img {
        width: 100%;
        border-radius: 10px;
      }
      .card p {
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 20px;
        border-radius: 20px;
        font-size: 20px;
        font-weight: bold;
        background-color: red;
        color: green;
      }
      #title {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #price {
        margin-right: 30px;
        font-size: 18px;
        font-weight: bold;
      }
      .desc{
        margin: 30px;
        text-align: center;
      }
      .desc p{
        margin: 10px 0px;
      }
